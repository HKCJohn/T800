const LETTERS = ["A", "B", "C", "D"];
const quizEl   = document.getElementById("quiz");
const doneEl   = document.getElementById("done");
const scoreEl  = document.getElementById("score");
const barEl    = document.getElementById("barFill");
const resultEl = document.getElementById("result");
const TOTAL    = DATA.length;
const PER      = 5;

let answered = 0;
let score = 0;

function build() {
  quizEl.innerHTML = "";
  answered = 0;
  score = 0;
  resultEl.classList.remove("show");
  updateHud();

  DATA.forEach((item, qi) => {
    const card = document.createElement("div");
    card.className = "card";

    const head = document.createElement("div");
    head.className = "qhead";
    head.innerHTML = '<span class="tag">第 ' + (qi + 1) + ' 題</span>' +
                     '<div class="qtext"></div>';
    head.querySelector(".qtext").textContent = item.q;
    card.appendChild(head);

    const list = document.createElement("div");
    item.opts.forEach((text, oi) => {
      const opt = document.createElement("div");
      opt.className = "opt";
      const k = document.createElement("span");
      k.className = "k";
      k.textContent = LETTERS[oi];
      const t = document.createElement("span");
      t.textContent = text;
      opt.appendChild(k);
      opt.appendChild(t);
      opt.addEventListener("click", () => pick(card, qi, oi));
      list.appendChild(opt);
    });
    card.appendChild(list);

    const exp = document.createElement("div");
    exp.className = "exp";
    exp.innerHTML = "<b>解析：</b>" + item.exp;
    card.appendChild(exp);

    quizEl.appendChild(card);
  });
}

function pick(card, qi, oi) {
  if (card.dataset.done === "1") return;
  card.dataset.done = "1";

  const item = DATA[qi];
  const opts = card.querySelectorAll(".opt");

  opts.forEach((o, i) => {
    o.classList.add("locked");
    if (i === item.a) o.classList.add("correct");
    else if (i === oi) o.classList.add("wrong");
    else o.classList.add("dim");
  });

  if (oi === item.a) score++;
  answered++;

  card.querySelector(".exp").classList.add("show");
  updateHud();

  if (answered === TOTAL) showResult();
}

function updateHud() {
  doneEl.textContent = answered;
  scoreEl.textContent = score * PER;
  barEl.style.width = (answered / TOTAL * 100) + "%";
}

function showResult() {
  const total = TOTAL * PER;
  const got = score * PER;
  const rate = Math.round(score / TOTAL * 100);

  document.getElementById("finalScore").textContent = got;
  document.getElementById("finalRate").textContent =
    "答對 " + score + " / " + TOTAL + " 題　正確率 " + rate + "%";

  let msg = "";
  if (rate === 100) msg = "太厲害了！全部正確，文學常識大師！";
  else if (rate >= 90) msg = "非常優秀，只差一點點就滿分。";
  else if (rate >= 75) msg = "表現不錯，把錯題解析再看一遍會更牢固。";
  else if (rate >= 60) msg = "基礎尚可，建議重點複習錯題解析。";
  else msg = "別灰心，對照每題解析重新梳理一遍再挑戰吧！";
  document.getElementById("finalMsg").textContent = msg;

  resultEl.classList.add("show");
  resultEl.scrollIntoView({ behavior: "smooth", block: "center" });
}

document.getElementById("resetBtn").addEventListener("click", () => {
  build();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

build();
</script>
